# ქართული (საქართველო): GridCraft's Georgian interface and formula language.
tag = "ka-GE"
native_name = "ქართული"
dbcs = false
bool_true = "TRUE"
bool_false = "FALSE"
r1c1 = "RC"
table_items = ["#All", "#Data", "#Headers", "#Totals", "#This Row"]
functions_from = "en-US"

[provenance]
"method" = "Formula words (function names, booleans, errors, table items, R1C1, CELL/INFO keywords, format letters) keep the en-US spelling, as for ja-JP, ko-KR and zh-*: formulas mix Georgian text with Latin cell references, so English names avoid switching keyboard layouts inside a formula. Default content names are original Georgian translations, chosen against the Craft apps' shared glossary and reviewed by a native speaker."
written = "2026-10-11"
unsourced = ["functions_from", "bool_true", "bool_false", "errors", "table_items", "content (no published Georgian Excel wording was consulted)"]

